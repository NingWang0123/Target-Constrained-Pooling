[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "target-constrained-pooling"
version = "0.1.0"
description = "Target-Constrained Pooling for caller-supplied free forecasts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "mpmath>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
